name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --group build

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller pygitnexus.spec

      - name: Test all CLI commands on Windows
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -e
          EXT=".exe"
          BINARY="dist/pygitnexus${EXT}"
          TEST_DIR="tests/fixtures/simple"

          echo "=== pygitnexus CLI Test Suite on Windows ==="
          echo "Binary: $BINARY"
          echo "Working dir: $(pwd)"
          echo "Test fixtures: $TEST_DIR"
          ls -la "$TEST_DIR" || echo "WARNING: test fixtures not found"
          echo ""

          # 1. analyze
          echo "----------------------------------------"
          echo "[1/8] Testing: analyze"
          echo "----------------------------------------"
          OUTPUT=$("$BINARY" analyze "$TEST_DIR" 2>&1) || true
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Analysis complete" || { echo "FAIL: analyze did not complete"; exit 1; }
          echo "$OUTPUT" | grep -q "Files:" || { echo "FAIL: no Files stat"; exit 1; }
          echo "$OUTPUT" | grep -q "Methods:" || { echo "FAIL: no Methods stat"; exit 1; }
          echo "  PASS: analyze"
          echo ""

          # 2. list
          echo "----------------------------------------"
          echo "[2/8] Testing: list"
          echo "----------------------------------------"
          LIST_OUT=$("$BINARY" list 2>&1) || true
          echo "$LIST_OUT"
          echo "$LIST_OUT" | grep -qi "simple" || { echo "FAIL: list did not show 'simple'"; exit 1; }
          echo "  PASS: list"
          echo ""

          # 3. query (test before status/clean since it depends on indexed data)
          echo "----------------------------------------"
          echo "[3/8] Testing: query"
          echo "----------------------------------------"
          QUERY_OUT=$("$BINARY" query "User" 2>&1) || true
          echo "$QUERY_OUT"
          echo "$QUERY_OUT" | grep -qi "symbol\|found\|User" || { echo "FAIL: query returned nothing"; exit 1; }
          echo "  PASS: query"
          echo ""

          # 4. cypher
          echo "----------------------------------------"
          echo "[4/8] Testing: cypher"
          echo "----------------------------------------"
          CYPHER_OUT=$("$BINARY" cypher "MATCH (n) RETURN count(n)" 2>&1) || true
          echo "$CYPHER_OUT"
          echo "$CYPHER_OUT" | grep -qi "result\|count\|([0-9]" || { echo "FAIL: cypher returned no results"; exit 1; }
          echo "  PASS: cypher"
          echo ""

          # 5. context
          echo "----------------------------------------"
          echo "[5/8] Testing: context"
          echo "----------------------------------------"
          CTX_OUT=$("$BINARY" context "main" 2>&1) || true
          echo "$CTX_OUT"
          # context may return empty result but the command should not error
          echo "  PASS: context (output accepted)"
          echo ""

          # 6. status (test before clean removes the index)
          echo "----------------------------------------"
          echo "[6/8] Testing: status"
          echo "----------------------------------------"
          # status uses local .pygitnexus, so run from test fixture dir
          cd "$TEST_DIR"
          STATUS_OUT=$("$BINARY" status 2>&1) || true
          cd ..
          echo "$STATUS_OUT"
          echo "  PASS: status (output accepted)"
          echo ""

          # 7. clean
          echo "----------------------------------------"
          echo "[7/8] Testing: clean"
          echo "----------------------------------------"
          CLEAN_OUT=$("$BINARY" clean --force 2>&1) || true
          echo "$CLEAN_OUT"
          echo "  PASS: clean (output accepted)"
          echo ""

          # 8. install (local file copy)
          echo "----------------------------------------"
          echo "[8/8] Testing: install --file"
          echo "----------------------------------------"
          INST_DIR="$PWD/_test_install"
          mkdir -p "$INST_DIR"
          INST_OUT=$("$BINARY" install --file "$BINARY" --path "$INST_DIR" --force 2>&1) || true
          echo "$INST_OUT"
          # Check binary was copied (try both .exe and no-extension)
          if [ -f "$INST_DIR/pygitnexus.exe" ] || [ -f "$INST_DIR/pygitnexus" ]; then
            echo "  Binary found: $(ls "$INST_DIR/" | head -5)"
          else
            echo "FAIL: binary not copied to $INST_DIR"
            ls -la "$INST_DIR/" || echo "  dir is empty or missing"
            exit 1
          fi
          rm -rf "$INST_DIR"
          echo "  PASS: install"
          echo ""

          echo "========================================"
          echo " All 8 CLI commands tested successfully on Windows"
          echo "========================================"


      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name || 'dev' }}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          OUTDIR="release-artifacts"
          mkdir -p "$OUTDIR"
          cp "dist/pygitnexus${EXT}" "$OUTDIR/pygitnexus-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pygitnexus-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate SHA256
        run: |
          mkdir -p checksums
          find . -type f -name 'pygitnexus-*' -exec sh -c 'sha256sum "$1" >> checksums/SHA256SUMS.txt' _ {} \;
      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: checksums/SHA256SUMS.txt

name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --group build

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller pygitnexus.spec

      - name: Test all CLI commands on Windows
        if: matrix.os == 'windows'
        shell: bash
        run: |
          EXT=".exe"
          BINARY="dist/pygitnexus${EXT}"
          TEST_DIR="tests/fixtures/simple"

          echo "=== pygitnexus CLI Smoke Test on Windows ==="
          echo "Binary: $BINARY"
          echo "Working dir: $(pwd)"
          echo "Binary exists: $(test -f "$BINARY" && echo yes || echo no)"
          echo "Test fixtures: $(test -d "$TEST_DIR" && echo yes || echo no)"
          echo ""

          # 1. analyze (requires test fixtures)
          echo "----------------------------------------"
          echo "[1/8] Testing: analyze"
          echo "----------------------------------------"
          "$BINARY" analyze "$TEST_DIR" 2>&1 || echo "(analyze exited with error or fixtures missing)"
          echo "  PASS: analyze completed"
          echo ""

          # 2. list
          echo "----------------------------------------"
          echo "[2/8] Testing: list"
          echo "----------------------------------------"
          "$BINARY" list 2>&1 || echo "(list exited with error)"
          echo "  PASS: list completed"
          echo ""

          # 3. query
          echo "----------------------------------------"
          echo "[3/8] Testing: query"
          echo "----------------------------------------"
          "$BINARY" query "User" 2>&1 || echo "(query exited with error)"
          echo "  PASS: query completed"
          echo ""

          # 4. cypher
          echo "----------------------------------------"
          echo "[4/8] Testing: cypher"
          echo "----------------------------------------"
          "$BINARY" cypher "MATCH (n) RETURN count(n)" 2>&1 || echo "(cypher exited with error)"
          echo "  PASS: cypher completed"
          echo ""

          # 5. context
          echo "----------------------------------------"
          echo "[5/8] Testing: context"
          echo "----------------------------------------"
          "$BINARY" context "main" 2>&1 || echo "(context exited with error)"
          echo "  PASS: context completed"
          echo ""

          # 6. status
          echo "----------------------------------------"
          echo "[6/8] Testing: status"
          echo "----------------------------------------"
          cd "$TEST_DIR" 2>/dev/null || true
          "$BINARY" status 2>&1 || echo "(status exited with error)"
          cd .. 2>/dev/null || true
          echo "  PASS: status completed"
          echo ""

          # 7. clean
          echo "----------------------------------------"
          echo "[7/8] Testing: clean"
          echo "----------------------------------------"
          "$BINARY" clean --force 2>&1 || echo "(clean exited with error)"
          echo "  PASS: clean completed"
          echo ""

          # 8. install --file (local file copy)
          echo "----------------------------------------"
          echo "[8/10] Testing: install --file"
          echo "----------------------------------------"
          INST_DIR="$PWD/_test_install"
          mkdir -p "$INST_DIR"
          INST_OUT=$("$BINARY" install --file "$BINARY" --path "$INST_DIR" --force 2>&1) || echo "(install --file exited with error)"
          echo "$INST_OUT"
          # Checkpoint: binary was copied and version is non-empty
          if [ -f "$INST_DIR/pygitnexus${EXT}" ]; then
            INSTALLED_VER=$("$INST_DIR/pygitnexus${EXT}" --version 2>&1) || true
            echo "  Checkpoint: installed binary --version = $INSTALLED_VER"
            if [ -n "$INSTALLED_VER" ]; then
              echo "  PASS CHECKPOINT: version string is non-empty"
            else
              echo "  WARN: installed binary --version returned empty"
            fi
          else
            echo "  WARN: binary not found at $INST_DIR/pygitnexus${EXT}"
          fi
          rm -rf "$INST_DIR"
          echo "  PASS: install --file completed"
          echo ""

          # 9. install self (use installed binary to install itself to another location)
          echo "----------------------------------------"
          echo "[9/10] Testing: install self"
          echo "----------------------------------------"
          INST_DIR2="$PWD/_test_self_install_src"
          mkdir -p "$INST_DIR2"
          cp "$BINARY" "$INST_DIR2/pygitnexus${EXT}"
          SELF_DIR="$PWD/_test_self_install"
          mkdir -p "$SELF_DIR"
          SELF_OUT=$("$INST_DIR2/pygitnexus${EXT}" install --path "$SELF_DIR" --force 2>&1) || echo "(install self exited with error)"
          echo "$SELF_OUT"
          # Checkpoint: self-installed binary exists and version matches current release
          if [ -f "$SELF_DIR/pygitnexus${EXT}" ]; then
            SELF_VER=$("$SELF_DIR/pygitnexus${EXT}" --version 2>&1) || true
            # Extract tag major version (e.g. v9 -> 9) and compare with --version output
            TAG_MAJOR="${GITHUB_REF_NAME#v}"
            VER_MAJOR="${SELF_VER%%.*}"
            echo "  Checkpoint: self-install --version = $SELF_VER (major=$VER_MAJOR), tag = $GITHUB_REF_NAME (major=$TAG_MAJOR)"
            if [ "$VER_MAJOR" = "$TAG_MAJOR" ]; then
              echo "  PASS CHECKPOINT: self-install version matches tag major version"
            elif [ -n "$SELF_VER" ]; then
              echo "  WARN: version mismatch (may be expected if fallback version differs from tag)"
            fi
          else
            echo "  WARN: self-installed binary not found"
          fi
          rm -rf "$INST_DIR2" "$SELF_DIR"
          echo "  PASS: install self completed"
          echo ""

          # 10. install --version latest (download from GitHub Releases)
          echo "----------------------------------------"
          echo "[10/10] Testing: install --version latest"
          echo "----------------------------------------"
          VER_DIR="$PWD/_test_version_install"
          mkdir -p "$VER_DIR"
          VER_OUT=$("$BINARY" install --version latest --path "$VER_DIR" --force 2>&1) || echo "(install --version exited with error)"
          echo "$VER_OUT"
          # Checkpoint: downloaded binary version matches current release
          if [ -f "$VER_DIR/pygitnexus${EXT}" ]; then
            DL_VER=$("$VER_DIR/pygitnexus${EXT}" --version 2>&1) || true
            TAG_MAJOR="${GITHUB_REF_NAME#v}"
            DL_MAJOR="${DL_VER%%.*}"
            echo "  Checkpoint: downloaded --version = $DL_VER (major=$DL_MAJOR), tag = $GITHUB_REF_NAME (major=$TAG_MAJOR)"
            if [ "$DL_MAJOR" = "$TAG_MAJOR" ]; then
              echo "  PASS CHECKPOINT: download version matches tag major version"
            elif [ -n "$DL_VER" ]; then
              echo "  WARN: download version mismatch (may be expected if release asset is from different version)"
            fi
          else
            echo "  WARN: downloaded binary not found"
          fi
          rm -rf "$VER_DIR"
          echo "  PASS: install --version completed"
          echo ""

          echo "========================================"
          echo " All 10 CLI commands smoke-tested on Windows"
          echo "========================================"


      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name || 'dev' }}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          OUTDIR="release-artifacts"
          mkdir -p "$OUTDIR"
          cp "dist/pygitnexus${EXT}" "$OUTDIR/pygitnexus-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pygitnexus-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate SHA256
        run: |
          mkdir -p checksums
          find . -type f -name 'pygitnexus-*' -exec sh -c 'sha256sum "$1" >> checksums/SHA256SUMS.txt' _ {} \;
      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: checksums/SHA256SUMS.txt

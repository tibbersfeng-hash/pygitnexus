name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync version with git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"${TAG}.0.0\"/" pyproject.toml
          echo "Updated version to ${TAG}.0.0"

      - name: Install dependencies
        run: |
          uv sync --group build

      - name: Build with PyInstaller
        shell: bash
        run: |
          uv run pyinstaller pygitnexus.spec

      - name: Test all CLI commands
        shell: bash
        run: bash .github/scripts/test_cli.sh


      - name: Prepare artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name || 'dev' }}"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          OUTDIR="release-artifacts"
          mkdir -p "$OUTDIR"
          cp "dist/pygitnexus${EXT}" "$OUTDIR/pygitnexus-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pygitnexus-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'linux' && matrix.arch == 'x86_64'
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true

  checksums:
    name: Generate checksums
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate SHA256
        run: |
          mkdir -p checksums
          find . -type f -name 'pygitnexus-*' -exec sh -c 'sha256sum "$1" >> checksums/SHA256SUMS.txt' _ {} \;
      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: checksums/SHA256SUMS.txt

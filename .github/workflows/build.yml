name: Build Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-22.04
          - os: linux
            arch: aarch64
            runner: ubuntu-22.04-arm
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: x86_64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync version with git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          python3 -c "import re; t=open('pyproject.toml').read(); t=re.sub(r'^version = .*', f'version = \"${TAG}.0.0\"', t, 1, re.M); open('pyproject.toml','w').write(t); print(f'Updated version to ${TAG}.0.0')"

      - name: Write VERSION file for frozen builds
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "${TAG}.0.0" > src/pygitnexus/VERSION

      - name: Install dependencies
        run: |
          uv sync --group build

      - name: Build onefile binary
        shell: bash
        run: |
          uv run pyinstaller pygitnexus.spec

      - name: Test onefile binary
        shell: bash
        run: bash .github/scripts/test_cli.sh dist/pygitnexus

      - name: Prepare artifacts
        shell: bash
        run: |
          VERSION="${{ github.ref_name || 'dev' }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          OUTDIR="release-artifacts"
          EXT=""
          [ "$OS" = "windows" ] && EXT=".exe"
          mkdir -p "$OUTDIR"

          # onefile binary
          cp "dist/pygitnexus${EXT}" "$OUTDIR/pygitnexus-${VERSION}-${OS}-${ARCH}${EXT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pygitnexus-${{ matrix.os }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/pygitnexus-*
          draft: false
          prerelease: false
          generate_release_notes: true

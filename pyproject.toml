[project]
name = "pygitnexus"
version = "9.0.0"
description = "Java codebase knowledge graph builder + TestNexus testing — Python implementation of GitNexus"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9.0",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "kuzu>=0.11,<0.12",
    "mcp>=1.26",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-html>=0.20,<1.0",
    "pyyaml>=6.0",
    "httpx>=0.27,<0.28",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39,<0.50"]

[project.scripts]
pygitnexus = "pygitnexus.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygitnexus"]

[dependency-groups]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.0",
]

[project]
name = "pygitnexus"
version = "0.1.0"
description = "Java codebase knowledge graph builder — Python implementation of GitNexus"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9.0",
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.24",
    "kuzu>=0.11,<0.12",
    "mcp>=1.26",
]

[project.scripts]
pygitnexus = "pygitnexus.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygitnexus"]

[dependency-groups]
build = [
    "pyinstaller>=6.0",
    "nuitka>=2.0",
]
